name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site and write config.js from secret
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          N8N_REPORT_WEBHOOK_URL: ${{ secrets.N8N_REPORT_WEBHOOK_URL }}
        run: |
          mkdir -p _site
          cp index.html app.js styles.css _site/
          printf 'window.DIALBRIDGE_CONFIG = { GOOGLE_MAPS_API_KEY: "%s", N8N_REPORT_WEBHOOK_URL: "%s" };\n' "$GOOGLE_MAPS_API_KEY" "$N8N_REPORT_WEBHOOK_URL" > _site/config.js
          touch _site/.nojekyll
          # Cache-bust: point the page at this commit's files so browsers never run stale JS/CSS.
          V="${GITHUB_SHA::8}-${GITHUB_RUN_NUMBER}"
          sed -i "s|src=\"app.js\"|src=\"app.js?v=$V\"|; s|src=\"config.js\"|src=\"config.js?v=$V\"|; s|href=\"styles.css\"|href=\"styles.css?v=$V\"|" _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
