name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site and write config.js from secret
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          N8N_REPORT_WEBHOOK_URL: ${{ secrets.N8N_REPORT_WEBHOOK_URL }}
          N8N_REPORT_EMAIL_URL: ${{ secrets.N8N_REPORT_EMAIL_URL }}
          N8N_SITE_CHECK_URL: ${{ secrets.N8N_SITE_CHECK_URL }}
          N8N_UNLOCK_SEND_URL: ${{ secrets.N8N_UNLOCK_SEND_URL }}
          N8N_UNLOCK_VERIFY_URL: ${{ secrets.N8N_UNLOCK_VERIFY_URL }}
          N8N_KEYWORD_URL: ${{ secrets.N8N_KEYWORD_URL }}
          N8N_FINDSITE_URL: ${{ secrets.N8N_FINDSITE_URL }}
        run: |
          mkdir -p _site
          cp index.html app.js engine.js scan.js questions.js report.js styles.css _site/
          # The Growth Blueprint PDF ships with the site so the lead-magnet email has a real
          # link to send. Its images go too, so the HTML source stays viewable.
          mkdir -p _site/blueprint
          cp -r blueprint/. _site/blueprint/
          mkdir -p _site/img
          cp -r img/. _site/img/
          printf 'window.DIALBRIDGE_CONFIG = { GOOGLE_MAPS_API_KEY: "%s", N8N_REPORT_WEBHOOK_URL: "%s", N8N_REPORT_EMAIL_URL: "%s", N8N_SITE_CHECK_URL: "%s", N8N_UNLOCK_SEND_URL: "%s", N8N_UNLOCK_VERIFY_URL: "%s", N8N_KEYWORD_URL: "%s", N8N_FINDSITE_URL: "%s" };\n' "$GOOGLE_MAPS_API_KEY" "$N8N_REPORT_WEBHOOK_URL" "$N8N_REPORT_EMAIL_URL" "$N8N_SITE_CHECK_URL" "$N8N_UNLOCK_SEND_URL" "$N8N_UNLOCK_VERIFY_URL" "$N8N_KEYWORD_URL" "$N8N_FINDSITE_URL" > _site/config.js
          touch _site/.nojekyll
          # Cache-bust: point the page at this commit's files so browsers never run stale JS/CSS.
          V="${GITHUB_SHA::8}-${GITHUB_RUN_NUMBER}"
          sed -i "s|src=\"app.js\"|src=\"app.js?v=$V\"|; s|src=\"engine.js\"|src=\"engine.js?v=$V\"|; s|src=\"scan.js\"|src=\"scan.js?v=$V\"|; s|src=\"questions.js\"|src=\"questions.js?v=$V\"|; s|src=\"report.js\"|src=\"report.js?v=$V\"|; s|src=\"config.js\"|src=\"config.js?v=$V\"|; s|href=\"styles.css\"|href=\"styles.css?v=$V\"|" _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
